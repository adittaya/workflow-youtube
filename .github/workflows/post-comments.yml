name: post-pending-comments

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  drain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --quiet google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Post queued comments (scheduled uploads now public)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::error::Repo secrets SUPABASE_URL / SUPABASE_SERVICE_KEY are not set — the drain would silently no-op in local mode. Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          python3 yt_auto.py comments