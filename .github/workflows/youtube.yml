name: YouTube Mirror Bot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no upload)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

env:
  YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
  YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
  YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Validate credentials
        run: |
          if [ -z "$YT_CLIENT_ID" ] || [ -z "$YT_CLIENT_SECRET" ] || [ -z "$YT_REFRESH_TOKEN" ]; then
            echo "::error::YouTube credentials not configured"
            echo "Add YT_CLIENT_ID, YT_CLIENT_SECRET, YT_REFRESH_TOKEN as GitHub Secrets"
            exit 1
          fi
          echo "YouTube credentials OK"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --break-system-packages -q yt-dlp 2>/dev/null || pip install -q yt-dlp
          pip install --break-system-packages -q -r requirements.txt 2>/dev/null || pip install -q -r requirements.txt

      - name: Run mirror
        id: mirror
        run: |
          # Set up data directory with repo config
          mkdir -p ~/.yt-mirror
          for f in channels.json settings.json state.json shortlink_keys.json accounts.json; do
            [ -f "$f" ] && cp "$f" ~/.yt-mirror/ || [ -f ~/.yt-mirror/"$f" ] || echo "{}" > ~/.yt-mirror/"$f"
          done

          # Dry run if requested
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 -c "import config; s=config.load_tui_settings(); s['dry_run']=True; config._write_json(config.SETTINGS_PATH, s)"
          fi

          python3 mirror.py 2>&1 | tee /tmp/mirror_output.txt
          EXIT_CODE=${PIPESTATUS[0]}

          # Persist state back to repo for next run
          cp ~/.yt-mirror/state.json state.json 2>/dev/null || true

          # Extract stats from output
          if [ -f /tmp/mirror_output.txt ]; then
            LAST=$(grep 'cycle done' /tmp/mirror_output.txt | tail -1 || true)
            MIRRORED=$(echo "$LAST" | grep -oP '\K\d+(?= mirrored)' || echo "0")
            COMMENTS=$(echo "$LAST" | grep -oP '\K\d+(?= comments)' || echo "0")
            ERRORS=$(echo "$LAST" | grep -oP '\K\d+(?= errors)' || echo "0")
            echo "mirrored=${MIRRORED:-0}" >> $GITHUB_OUTPUT
            echo "comments=${COMMENTS:-0}" >> $GITHUB_OUTPUT
            echo "errors=${ERRORS:-0}" >> $GITHUB_OUTPUT
          fi

          exit $EXIT_CODE

      - name: Persist state
        if: always()
        run: |
          git config user.name "yt-mirror[bot]"
          git config user.email "yt-mirror[bot]@users.noreply.github.com"
          cp ~/.yt-mirror/state.json state.json 2>/dev/null || true
          git add state.json
          git diff --cached --quiet || git commit -m "state: update mirror state [skip ci]" && git push || true

      - name: Summary
        if: always()
        run: |
          MIRRORED="${{ steps.mirror.outputs.mirrored || '0' }}"
          COMMENTS="${{ steps.mirror.outputs.comments || '0' }}"
          ERRORS="${{ steps.mirror.outputs.errors || '0' }}"
          echo "## YouTube Mirror Result" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Mirrored | $MIRRORED |" >> $GITHUB_STEP_SUMMARY
          echo "| Comments | $COMMENTS |" >> $GITHUB_STEP_SUMMARY
          echo "| Errors | $ERRORS |" >> $GITHUB_STEP_SUMMARY
