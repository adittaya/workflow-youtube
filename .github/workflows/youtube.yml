name: YouTube Mirror Bot

on:
  schedule:
    # Check every 6 hours for new videos
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no upload)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      PROJECT_ID: ${{ secrets.PROJECT_ID }}
      CHANNELS: ${{ secrets.CHANNELS }}
      SETTINGS: ${{ secrets.SETTINGS }}
      SHORTLINK_KEYS: ${{ secrets.SHORTLINK_KEYS }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Validate credentials
        run: |
          MISSING=""
          [ -z "$YT_CLIENT_ID" ] && MISSING="$MISSING YT_CLIENT_ID"
          [ -z "$YT_CLIENT_SECRET" ] && MISSING="$MISSING YT_CLIENT_SECRET"
          [ -z "$YT_REFRESH_TOKEN" ] && MISSING="$MISSING YT_REFRESH_TOKEN"
          [ -z "$CHANNELS" ] && MISSING="$MISSING CHANNELS"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing secrets:$MISSING"
            exit 1
          fi
          echo "All required secrets configured"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1 || true
          pip install --break-system-packages -q -r requirements.txt
          pip install --break-system-packages -q demucs soundfile torch

      - name: Build config from secrets
        run: |
          mkdir -p ~/.yt-mirror
          mkdir -p ~/.yt-mirror/{bgm,separated,processed}

          echo "$CHANNELS" > ~/.yt-mirror/channels.json

          if [ -n "$SETTINGS" ]; then
            echo "$SETTINGS" > ~/.yt-mirror/settings.json
          else
            cat > ~/.yt-mirror/settings.json << 'EOF'
          {
            "privacy_status": "public",
            "category_id": "22",
            "check_interval_minutes": 15,
            "max_per_cycle": 3,
            "comment_moderation": "heldForReview",
            "shortener_provider": "vplink",
            "warmup_days": 14
          }
          EOF
          fi

          if [ -n "$SHORTLINK_KEYS" ]; then
            echo "$SHORTLINK_KEYS" > ~/.yt-mirror/shortlink_keys.json
          else
            echo "{}" > ~/.yt-mirror/shortlink_keys.json
          fi

          # Restore mirror state from repo (only if no Supabase)
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            if [ -f state.json ]; then
              cp state.json ~/.yt-mirror/state.json
            else
              echo '{"processed":{},"stats":{"total_mirrored":0,"total_comments":0,"total_shortened":0}}' > ~/.yt-mirror/state.json
            fi

            if [ -f upload_state.json ]; then
              cp upload_state.json ~/.yt-mirror/upload_state.json
            else
              echo '{"warmup_start":null,"warmup_complete":false,"total_uploaded":0,"last_upload_date":null,"last_upload_hour":null,"processed_hashes":[]}' > ~/.yt-mirror/upload_state.json
            fi
          else
            echo "Supabase configured — state loaded from database"
          fi

          python3 -c "
          import json, time, os
          accounts = {
              'main': {
                  'client_id': os.environ['YT_CLIENT_ID'],
                  'client_secret': os.environ['YT_CLIENT_SECRET'],
                  'refresh_token': os.environ['YT_REFRESH_TOKEN'],
                  'channel_id': '',
                  'channel_name': 'main',
                  'added_at': time.strftime('%Y-%m-%dT%H:%M:%SZ'),
              }
          }
          with open(os.path.expanduser('~/.yt-mirror/accounts.json'), 'w') as f:
              json.dump(accounts, f, indent=2)
          "

          echo "Config built successfully"

      - name: Check warmup status
        id: warmup
        run: |
          # Auto-start warmup, auto-complete if elapsed, reset if account changed
          python3 -c "
          import sys, hashlib
          sys.path.insert(0, '$GITHUB_WORKSPACE')
          import daily_uploader

          state = daily_uploader.load_upload_state()
          current_client_id = '${{ secrets.YT_CLIENT_ID }}'
          stored_client_id = state.get('yt_client_id', '')

          if stored_client_id and stored_client_id != current_client_id:
              daily_uploader.reset_warmup('account changed')
              state = daily_uploader.load_upload_state()

          state['yt_client_id'] = current_client_id
          daily_uploader.save_upload_state(state)
          daily_uploader.start_warmup()
          "

          python3 $GITHUB_WORKSPACE/daily_mirror.py status 2>&1 | tee /tmp/warmup_status.txt

          # Extract warmup day for summary
          WARMUP_DAY=$(grep 'day ' /tmp/warmup_status.txt | head -1 | grep -oP '\d+' | head -1 || echo "0")
          CAN_UPLOAD=$(grep 'YES' /tmp/warmup_status.txt | wc -l)
          if [ "$CAN_UPLOAD" -gt 0 ]; then CAN_UPLOAD="true"; else CAN_UPLOAD="false"; fi
          echo "warmup_day=${WARMUP_DAY:-0}" >> $GITHUB_OUTPUT
          echo "can_upload=${CAN_UPLOAD}" >> $GITHUB_OUTPUT

      - name: Detect new videos (always)
        id: detect
        run: |
          python3 -c "
          import sys, os
          sys.path.insert(0, '$GITHUB_WORKSPACE')
          import config
          import daily_uploader
          import youtube_api
          import supabase_db

          channels = config.load_channels()
          youtube = youtube_api.get_client()
          pid = os.environ.get('PROJECT_ID', '')
          up_state = daily_uploader.load_upload_state()
          pending_hashes = list(up_state.get('pending_hashes', []))
          processed_hashes = set(up_state.get('processed_hashes', []))
          cursors = supabase_db.get_all_cursors(project_id=pid)
          found_new = False

          for ch_id, ch in channels.items():
              try:
                  playlist_id = youtube_api.get_channel_uploads_playlist(youtube, ch_id)
                  if not playlist_id:
                      continue
                  recent = youtube_api.get_recent_videos(youtube, playlist_id, max_results=10)
                  if not recent:
                      continue

                  cursor = (cursors.get(ch_id) or {}).get('last_video_id', '')
                  latest_id = recent[0]['video_id']

                  # Collect all new videos since cursor (newest-first order)
                  new_ids = []
                  for v in recent:
                      if v['video_id'] == cursor:
                          break
                      if v['video_id'] not in processed_hashes and v['video_id'] not in pending_hashes:
                          new_ids.append(v['video_id'])

                  if new_ids:
                      found_new = True
                      # Prepend reversed (oldest-first) to pending queue
                      pending_hashes = new_ids[::-1] + pending_hashes
                       name_key = 'name'
                       config.log(f'{len(new_ids)} new video(s) from {ch.get(name_key, ch_id)}: {new_ids[::-1]}')

                  # Update cursor to latest
                  supabase_db.save_channel_cursor(ch_id, {'last_video_id': latest_id}, project_id=pid)

              except Exception as e:
                  config.log(f'detect error {ch_id}: {e}')

          # Persist pending_hashes
          up_state['pending_hashes'] = pending_hashes
          daily_uploader.save_upload_state(up_state)

          if found_new:
              print('new_detected=true')
          else:
              print('new_detected=false')
          " 2>&1

      - name: Process and upload
        run: |
          cd ~/.yt-mirror
          CAN_UPLOAD=${{ steps.warmup.outputs.can_upload }}

          if [ "$CAN_UPLOAD" != "true" ] && [ "${{ inputs.dry_run }}" != "true" ]; then
              echo "Warmup/cooldown — skipping upload"
              echo "## Can't upload yet" >> $GITHUB_STEP_SUMMARY
              exit 0
          fi

          if [ "${{ inputs.dry_run }}" = "true" ]; then
              python3 -c "
          import json
          s = json.loads(open('settings.json').read())
          s['dry_run'] = True
          open('settings.json', 'w').write(json.dumps(s, indent=2))
          "
          fi

          python3 -c "
          import sys, os
          sys.path.insert(0, '$GITHUB_WORKSPACE')
          import config
          import daily_uploader
          import download_helpers
          import youtube_api
          import supabase_db

          youtube = youtube_api.get_client()
          pid = os.environ.get('PROJECT_ID', '')
          up_state = daily_uploader.load_upload_state()

          uploaded_count = 0
          while True:
              pending_hashes = list(up_state.get('pending_hashes', []))
              processed_hashes = list(up_state.get('processed_hashes', []))

              # Pop oldest pending video not yet uploaded
              target_id = None
              temp = list(pending_hashes)
              pending_hashes = []
              for v in temp:
                  if v not in processed_hashes and target_id is None:
                      target_id = v
                  else:
                      pending_hashes.append(v)

              if not target_id:
                  config.log('nothing pending — all detected videos already uploaded')
                  up_state['pending_hashes'] = []
                  daily_uploader.save_upload_state(up_state)
                  break

              # Check if we can upload (cooldown: 18h between uploads)
              if not daily_uploader.can_upload_today():
                  config.log('cooldown active — 18h gap not elapsed, stopping')
                  up_state['pending_hashes'] = [target_id] + pending_hashes
                  daily_uploader.save_upload_state(up_state)
                  break

              config.log(f'processing pending video: {target_id} (batch #{uploaded_count + 1})')

              source_url = f'https://www.youtube.com/watch?v={target_id}'
              vid = None

              try:
                  vid = {'video_id': target_id, 'title': f'Video {target_id}', 'description': '', 'tags': []}
                  try:
                      resp = youtube.videos().list(part='snippet', id=target_id).execute()
                      items = resp.get('items', [])
                      if items:
                          sn = items[0]['snippet']
                          vid = {
                              'video_id': target_id,
                              'title': sn.get('title', vid['title']),
                              'description': sn.get('description', ''),
                              'tags': sn.get('tags', []),
                          }
                  except Exception as e:
                      config.log(f'could not fetch video info: {e}')

                  config.log(f'uploading: {vid["title"]} ({target_id})')
                  result = download_helpers.download_video(source_url, f'/tmp/daily_{target_id}')
                  if not result:
                      config.log(f'download failed: {target_id}')
                      up_state['pending_hashes'] = [target_id] + pending_hashes
                      daily_uploader.save_upload_state(up_state)
                      break
                  path = result['path'] if isinstance(result, dict) else result

                  config.log(f'processing: {target_id}')
                  processed = daily_uploader.process_video(path)
                  if not processed:
                      config.log(f'processing failed: {target_id}')
                      up_state['pending_hashes'] = [target_id] + pending_hashes
                      daily_uploader.save_upload_state(up_state)
                      break

                  title = vid.get('title', f'Daily Upload {target_id}')
                  desc = vid.get('description', '')
                  tags = vid.get('tags', [])
                  video_id = daily_uploader.upload_daily(processed, title, desc, tags, source_url=source_url)
                  if video_id:
                      config.log(f'uploaded: {video_id}')
                      uploaded_count += 1
                      processed_hashes.append(target_id)
                      up_state['processed_hashes'] = processed_hashes
                      up_state['pending_hashes'] = pending_hashes
                      daily_uploader.save_upload_state(up_state)
                      config.log(f'{len(pending_hashes)} remaining in queue')
                  else:
                      config.log(f'upload failed: {title}')
                      up_state['pending_hashes'] = [target_id] + pending_hashes
                      daily_uploader.save_upload_state(up_state)
                      break
              except Exception as e:
                  config.log(f'error: {e}')
                  up_state['pending_hashes'] = [target_id] + pending_hashes
                  daily_uploader.save_upload_state(up_state)
                  break

              # Re-check cooldown before next iteration
              up_state = daily_uploader.load_upload_state()

          if uploaded_count:
              config.log(f'uploaded {uploaded_count} video(s) this cycle')
          else:
              config.log('no video uploaded this cycle')
          " 2>&1 | tee /tmp/process_output.txt

          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Persist state
        if: always()
        run: |
          # Skip file-based persistence when Supabase is configured
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_KEY" ]; then
            echo "Supabase configured — state persisted to database"
            exit 0
          fi

          git config user.name "yt-mirror[bot]"
          git config user.email "yt-mirror[bot]@users.noreply.github.com"

          cp ~/.yt-mirror/state.json state.json 2>/dev/null || true
          cp ~/.yt-mirror/upload_state.json upload_state.json 2>/dev/null || true

          git add state.json upload_state.json
          git diff --cached --quiet || git commit -m "state: update [skip ci]" && git push || true

      - name: Summary
        if: always()
        run: |
          echo "## YouTube Mirror Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Warmup day | ${{ steps.warmup.outputs.warmup_day }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Can upload | ${{ steps.warmup.outputs.can_upload }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f /tmp/process_output.txt ]; then
            echo "### Process Log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -30 /tmp/process_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
